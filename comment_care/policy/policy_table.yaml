# Policy Engine — bảng luật deterministic (spec mục F/G/I). Model KHÔNG ghi đè được bảng này.
# decision: REPLY | SKIP | ESCALATE | NO_REPLY_NEEDED
# generator: TEMPLATE | LLM_STRONG | LLM_CHEAP | NONE
# footer: yes | no        (chỉ có hiệu lực khi footer_policy của kênh là B/BC; A = luôn yes, C = luôn yes nhưng rotate)
# auto_phase: pha sớm nhất được phép gửi tự động (4 = LOW, 5 = MEDIUM, 99 = không bao giờ trong V1)
# length: [min, max] ký tự Nhật của phần thân (không tính footer). 2026-10-22: mọi max = 50 (reply ngắn như người thật, HUONG_DAN_HERMES)
policy_version: v1

thresholds:
  skip_below: 0.70            # classification_conf hoặc understanding_conf dưới mức này → SKIP + UNRESOLVED
  auto_low: 0.85
  auto_medium: 0.90
  hostile_template_min: 0.70  # dưới mức này HOSTILE vẫn template nhưng chỉ DRAFT (không auto)

categories:
  GRATITUDE_SIMPLE:        {decision: REPLY, risk: LOW,    generator: TEMPLATE,   footer: yes, auto_phase: 4,  length: [10, 50]}
  PRAISE:                  {decision: REPLY, risk: LOW,    generator: TEMPLATE,   footer: yes, auto_phase: 4,  length: [10, 50]}
  EXPERIENCE_SHARING:      {decision: REPLY, risk: LOW,    generator: LLM_STRONG, footer: yes, auto_phase: 4,  length: [10, 50]}
  EMOTIONAL_SHARING:       {decision: REPLY, risk: MEDIUM, generator: LLM_STRONG, footer: yes, auto_phase: 5,  length: [10, 50]}
  GRIEF_LOSS:              {decision: REPLY, risk: HIGH,   generator: LLM_STRONG, footer: no,  auto_phase: 99, length: [10, 50], double_judge: true}
  AGREEMENT:               {decision: REPLY, risk: LOW,    generator: TEMPLATE,   footer: yes, auto_phase: 4,  length: [10, 50]}
  DISAGREEMENT_POLITE:     {decision: REPLY, risk: MEDIUM, generator: LLM_STRONG, footer: yes, auto_phase: 5,  length: [10, 50]}
  CRITICISM_CONSTRUCTIVE:  {decision: REPLY, risk: MEDIUM, generator: TEMPLATE,   footer: yes, auto_phase: 5,  length: [10, 50]}
  QUESTION_OPINION:        {decision: REPLY, risk: MEDIUM, generator: LLM_STRONG, footer: yes, auto_phase: 5,  length: [10, 50]}
  QUESTION_FACTUAL:        {decision: REPLY, risk: HIGH,   generator: TEMPLATE,   footer: no,  auto_phase: 99, length: [8, 50], template_key: THANKS, reason: can_fact_check}   # 2026-10-22 HUONG_DAN_HERMES: hỏi lương hưu/thuế/luật/thuốc → CHỈ cảm ơn
  REQUEST:                 {decision: REPLY, risk: LOW,    generator: TEMPLATE,   footer: yes, auto_phase: 4,  length: [10, 50]}
  HEALTH_SHARING:          {decision: REPLY, risk: HIGH,   generator: LLM_STRONG, footer: no,  auto_phase: 99, length: [10, 50], double_judge: true}
  FINANCIAL_SPECIFIC:      {decision: REPLY, risk: MEDIUM, generator: TEMPLATE,   footer: yes, auto_phase: 5,  length: [10, 50]}
  CRISIS:                  {decision: ESCALATE, risk: HIGH, generator: NONE,      footer: no,  auto_phase: 99, reason: crisis_signal}
  POLITICAL_SOCIAL:        {decision: REPLY, risk: HIGH,   generator: TEMPLATE,   footer: no,  auto_phase: 99, length: [10, 50], template_key: SENSITIVE, reason: political_social}   # anh chốt 2026-10-15 (lần 2): câu nhạy cảm KHÔNG soạn riêng — chỉ đăng câu cố định SENSITIVE, không footer, không like/tim
  HOSTILE:                 {decision: REPLY, risk: MEDIUM, generator: TEMPLATE,   footer: no,  auto_phase: 5,  length: [10, 50], template_key: SENSITIVE}
  SPAM_PROMO:              {decision: NO_REPLY_NEEDED, risk: LOW, generator: NONE, footer: no, auto_phase: 99}
  OFF_TOPIC:               {decision: NO_REPLY_NEEDED, risk: LOW, generator: NONE, footer: no, auto_phase: 99}
  VIEWER_TO_VIEWER:        {decision: NO_REPLY_NEEDED, risk: LOW, generator: NONE, footer: no, auto_phase: 99}
  FOLLOW_UP_TO_OWNER:      {decision: REPLY, risk: MEDIUM, generator: LLM_STRONG, footer: yes,  auto_phase: 5,  length: [10, 50], max_bot_replies_per_thread: 2}
  UNCLEAR:                 {decision: SKIP,  risk: HIGH,   generator: NONE,       footer: no,  auto_phase: 99, reason: unclear}

# Anh chốt 2026-10-15: bình luận nhạy cảm/gay gắt mà em KHÔNG trả lời được (low_confidence, sarcasm) ở các nhóm này
# → KHÔNG bỏ qua, đăng câu cố định SENSITIVE (「はい、ご意見ありがとうございます。」 = "Vâng, cảm ơn bạn đã góp ý").
sensitive_fallback_categories: [HOSTILE, POLITICAL_SOCIAL, CRITICISM_CONSTRUCTIVE, DISAGREEMENT_POLITE]

# Flag phụ ép rủi ro / quyết định (áp sau khi tra category)
flag_overrides:
  not_japanese:      {decision: SKIP, reason: not_japanese}
  sarcasm_possible:  {max_understanding_conf: 0.6}      # ép understanding_conf ≤ 0.6 → rơi xuống SKIP
  asks_question_factual: {decision: REPLY, template_key: THANKS, reason: can_fact_check}   # 2026-10-22: chỉ cảm ơn, không trả lời nội dung
  contains_url:      {category_hint: SPAM_PROMO}

# Secondary category nâng risk = max(primary, secondary)
risk_order: [LOW, MEDIUM, HIGH]

# 2026-10-22 (HUONG_DAN_HERMES mục 0.4): khó/không chắc (độ tin thấp) ở nhóm KHÔNG nhạy cảm → không bỏ qua, chỉ cảm ơn (template THANKS).
# UNCLEAR (vô nghĩa / 1 chữ) và không phải tiếng Nhật vẫn SKIP.
low_confidence_template: THANKS
